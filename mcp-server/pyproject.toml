[project]
name = "bob4q-mcp"
version = "0.1.0"
description = "Qiskit MCP server for IBM Bob integration"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "qiskit-ibm-runtime>=0.20.0",
    "httpx>=0.27.0",
    "uvicorn>=0.29.0",
    "fastapi>=0.111.0",
]

[dependency-groups]
dev = ["ruff>=0.6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
