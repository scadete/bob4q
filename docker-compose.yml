# Compose file — works with Podman Compose and Docker Compose
# Podman (recommended): podman compose up
# Docker fallback:      docker compose up
#
# Podman Desktop: https://podman-desktop.io (macOS/Windows/Linux GUI)

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_MCP_URL=http://mcp-server:8765
    depends_on:
      - mcp-server

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: ../docker/mcp.Dockerfile
    ports:
      - "8765:8765"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - GRANITE_MODEL=${GRANITE_MODEL:-granite3.1-dense:8b}
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        OLLAMA_PID=$$!
        echo "Waiting for Ollama to start..."
        until curl -sf http://localhost:11434 > /dev/null; do sleep 2; done
        echo "Pulling model ${GRANITE_MODEL:-granite3.1-dense:8b} ..."
        ollama pull ${GRANITE_MODEL:-granite3.1-dense:8b}
        wait $$OLLAMA_PID

volumes:
  ollama-models:
